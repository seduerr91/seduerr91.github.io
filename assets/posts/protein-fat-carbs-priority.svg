<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protein, fat, and carbs house analogy</title>
  <desc id="desc">An illustrated house showing protein as bricks, carbohydrates as electricity, and fat as plumbing and insulation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8efe3"/>
      <stop offset="100%" stop-color="#dceee4"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#cc5a3d"/>
      <stop offset="100%" stop-color="#9f3f29"/>
    </linearGradient>
    <linearGradient id="house" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f3eadf"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="160" r="78" fill="#ffd77a" opacity="0.8"/>
  <circle cx="1460" cy="130" r="32" fill="#fff6d6" opacity="0.9"/>
  <circle cx="1290" cy="120" r="26" fill="#fff6d6" opacity="0.8"/>

  <text x="120" y="140" fill="#20352a" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">
    Protein, Fat, and Carbs
  </text>
  <text x="120" y="205" fill="#3d564b" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34">
    Three essential macros. Three different jobs.
  </text>

  <polygon points="470,330 800,130 1130,330" fill="url(#roof)"/>
  <rect x="520" y="330" width="560" height="410" rx="24" fill="url(#house)" stroke="#ddc7b0" stroke-width="6"/>
  <rect x="730" y="540" width="140" height="200" rx="18" fill="#d1a680"/>
  <rect x="590" y="430" width="110" height="100" rx="10" fill="#b9d7f0"/>
  <rect x="900" y="430" width="110" height="100" rx="10" fill="#b9d7f0"/>

  <g fill="#c97b52">
    <rect x="550" y="362" width="85" height="34" rx="5"/>
    <rect x="645" y="362" width="85" height="34" rx="5"/>
    <rect x="740" y="362" width="85" height="34" rx="5"/>
    <rect x="835" y="362" width="85" height="34" rx="5"/>
    <rect x="930" y="362" width="85" height="34" rx="5"/>

    <rect x="590" y="404" width="85" height="34" rx="5"/>
    <rect x="685" y="404" width="85" height="34" rx="5"/>
    <rect x="780" y="404" width="85" height="34" rx="5"/>
    <rect x="875" y="404" width="85" height="34" rx="5"/>
  </g>

  <path d="M1210 390 C1280 350, 1360 350, 1420 400" fill="none" stroke="#f2a900" stroke-width="12" stroke-linecap="round"/>
  <path d="M1330 325 L1360 375 L1305 375 Z" fill="#f2a900"/>
  <path d="M1210 520 C1280 470, 1365 470, 1430 525" fill="none" stroke="#4fa2c6" stroke-width="12" stroke-linecap="round"/>
  <circle cx="1200" cy="523" r="18" fill="#4fa2c6"/>
  <circle cx="1440" cy="523" r="18" fill="#4fa2c6"/>

  <rect x="103" y="322" width="270" height="146" rx="28" fill="#ffffff" opacity="0.82"/>
  <text x="135" y="382" fill="#7c3f23" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="36" font-weight="700">
    Protein = Bricks
  </text>
  <text x="135" y="428" fill="#5e5a52" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24">
    Builds and repairs tissue
  </text>

  <rect x="118" y="512" width="270" height="146" rx="28" fill="#ffffff" opacity="0.82"/>
  <text x="150" y="572" fill="#916d00" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="36" font-weight="700">
    Carbs = Power
  </text>
  <text x="150" y="618" fill="#5e5a52" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24">
    Fuel for brain and training
  </text>

  <rect x="1202" y="620" width="286" height="146" rx="28" fill="#ffffff" opacity="0.82"/>
  <text x="1236" y="680" fill="#22617f" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="36" font-weight="700">
    Fat = Systems
  </text>
  <text x="1236" y="726" fill="#5e5a52" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24">
    Hormones, vitamins, steady energy
  </text>

  <text x="800" y="826" text-anchor="middle" fill="#355347" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="30">
    Prioritize protein first, keep fats sufficient, adjust carbs to match activity.
  </text>
</svg>
